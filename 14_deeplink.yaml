appId: com.demobank.app
name: FR-14 Deep link opens an in-app page and back returns
tags: [deeplink]
# The Deep link test screen lists nexusdemo://debug/hub, /image and /biometric (observed on device).
# The Deep link test screen itself has no listed URI, so the hub URI is used to prove
# that an external deep link lands directly on an in-app page.
---
- launchApp:
    clearState: true
    permissions: { all: unset }
- openLink: "nexusdemo://debug/image"
- extendedWaitUntil:
    visible:
      id: "hook_camera_capture"
    timeout: 20000
- back
# Hub or domain picker is shown after back
- extendedWaitUntil:
    visible:
      id: "standalone_item_image|domain_selector_root"
    timeout: 15000
