appId: com.demobank.app
name: FR-15 OTP verification rejects wrong or empty OTP
tags: [otp]
env:
  PHONE: "447990475676"
---
- runFlow: ../subflows/open_hub.yaml
- scrollUntilVisible:
    element:
      id: "standalone_item_otp"
- tapOn:
    id: "standalone_item_otp"
- assertVisible: "Verify Phone"
- tapOn: "Phone Number"
- inputText: ${PHONE}
- hideKeyboard
- tapOn: "Send OTP"
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Enter OTP"
# Wrong OTP
- tapOn: "OTP"
- inputText: "0000"
- hideKeyboard
- tapOn: "Verify OTP"
- assertNotVisible: "OTP verified"
# Empty OTP: re-enter the screen from a clean state rather than erasing text
- back
- tapOn:
    id: "standalone_item_otp"
- tapOn: "Phone Number"
- inputText: ${PHONE}
- hideKeyboard
- tapOn: "Send OTP"
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Enter OTP"
- tapOn: "Verify OTP"
- assertNotVisible: "OTP verified"
