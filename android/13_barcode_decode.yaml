appId: com.demobank.app
name: FR-13 Barcode scanner decodes an injected QR code
tags: [device-feature, camera, barcode]
# BrowserStack: run with camera image injection and an uploaded QR image (see RUNBOOK.md)
---
- runFlow: ../subflows/open_hub.yaml
- scrollUntilVisible:
    element:
      id: "standalone_item_barcode"
- tapOn:
    id: "standalone_item_barcode"
- assertVisible: "No barcode read yet"
- tapOn: "Open barcode scanner"
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Point camera at a barcode or QR code"
# The decoded value replaces the idle text once the injected QR is scanned
- extendedWaitUntil:
    notVisible: "No barcode read yet"
    timeout: 30000
