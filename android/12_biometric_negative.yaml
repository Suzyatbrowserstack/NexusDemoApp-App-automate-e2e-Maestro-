appId: com.demobank.app
name: FR-12 Biometric FAIL and CANCEL do not authenticate
tags: [device-feature, biometric]
# BrowserStack: run with enableBiometric (see RUNBOOK.md)
# Observed on device: BrowserStack dialog buttons are android:id/button3 (CANCEL),
# button2 (FAIL), button1 (PASS). After FAIL the dialog stays up (retry), and CANCEL
# ends it with "Fingerprint operation cancelled by user."
---
- runFlow: ../subflows/open_hub.yaml
- tapOn:
    id: "standalone_item_biometric"
- assertVisible:
    id: "hook_biometric_prompt"
# FAIL
- tapOn:
    id: "hook_biometric_authorize"
- extendedWaitUntil:
    visible:
      id: "android:id/button2"
    timeout: 15000
- tapOn:
    id: "android:id/button2"
- assertNotVisible: "Biometric success"
# CANCEL (from the dialog that is still shown after FAIL)
- tapOn:
    id: "android:id/button3"
- assertNotVisible: "Biometric success"
- assertVisible: "Fingerprint operation cancelled by user."
- assertVisible:
    id: "hook_biometric_authorize"
# Authorize again and CANCEL directly
- tapOn:
    id: "hook_biometric_authorize"
- extendedWaitUntil:
    visible:
      id: "android:id/button3"
    timeout: 15000
- tapOn:
    id: "android:id/button3"
- assertNotVisible: "Biometric success"
